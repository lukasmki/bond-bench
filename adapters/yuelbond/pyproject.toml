[project]
name = "bond-bench-yuelbond-adapter"
version = "0.1.0"
description = "YuelBond (Wang & Dokholyan) behind the bond-bench external protocol (upstream has no licence; fetched at setup)"
requires-python = "==3.11.*"
# Upstream pins nothing; these are its README dependencies that inference imports.
dependencies = [
    "torch>=2.2",
    "pytorch-lightning>=2.0",
    "wandb",
    "biopython",
    "rdkit>=2024.3",
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "pyyaml",
]

[tool.uv]
package = false
